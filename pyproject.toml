[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pedigree"
version = "0.1.0"
description = "Check whether a model comes from the model it claims, from its weights"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy>=1.24", "gguf>=0.10", "scipy>=1.10"]  # gguf: GGUF files; scipy: weight matching

[project.scripts]
pedigree = "pedigree.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "safetensors>=0.4", "torch>=2.2"]
# the reference libraries tests/test_formats.py checks each R1 reader against (amendment 2026-11-20)
reference = ["onnx==1.23.2", "ctranslate2==4.9.0", "flatbuffers==25.12.19", "tflite==2.18.0",
             "litert-lm-builder==0.19.2", "paddlepaddle==3.3.1",
             # 2026-11-21: ONNX quantisation parity (readers v5); 1.31 publishes no Python 3.10 wheel
             "onnxruntime==1.31.1; python_version >= '3.11'", "onnxruntime==1.23.2; python_version < '3.11'",
             "onnx-ir==1.1.0"]
# E1: building ground-truth derivatives (fine-tune, merge, quantise, prune, distil)
experiments = ["transformers>=4.57", "diffusers>=0.30", "timm>=1.0", "pandas", "pyarrow", "soundfile", "pillow", "torch>=2.2", "safetensors>=0.4", "peft>=0.13"]

[tool.setuptools.packages.find]
include = ["pedigree*"]

[tool.setuptools.package-data]
pedigree = ["thresholds.json"]
