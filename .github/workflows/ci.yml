name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      # transformers: the permutation and re-basin tests (tiny random configs, no downloads). 5.22.1 is the version
      # the Kaggle jobs pin; it needs Python >= 3.11, and 5.20.2 is the newest release for 3.10
      - run: pip install -e ".[dev,reference]" pandas "transformers==5.22.1; python_version >= '3.11'" "transformers==5.20.2; python_version < '3.11'"
      - run: python -m pytest -q -rs
        env:
          PEDIGREE_REQUIRE_CC: "1"   # the GGUF reference-parity tests must run here, not skip
          PEDIGREE_NO_SKIPS: "1"     # any skipped test fails the run (tests/conftest.py)
      - name: verdicts, RESULTS.md and the site match the ledger
        run: |
          python scripts/analyse.py
          python scripts/build_site.py
          git diff --exit-code results/verdicts.json docs/RESULTS.md site/
